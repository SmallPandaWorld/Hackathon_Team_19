services:
  backend:
    build: ./backend
    # Only reachable from this machine. The app trusts the VISCON identity
    # headers, so the public must go through the managed proxy -> frontend.
    ports:
      - 127.0.0.1:8000:8000
    environment:
      DATABASE_URL: sqlite:////data/users.db
      AVATAR_STORAGE_DIR: /data/avatars
      MEETUP_PHOTO_STORAGE_DIR: /data/meetup_photos
      QUEST_PHOTO_STORAGE_DIR: /data/quest_photos
      # Comma-separated VISCON user IDs (X-User-Id) of quest maintainers.
      # Set it on the server, e.g. in a .env file next to this file.
      MAINTAINER_IDS: ${MAINTAINER_IDS:-}
    env_file:
      - path: .env
        required: false
    volumes:
      # Survives `docker compose down` / rebuilds. Never use `down -v`.
      - backend-data:/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - 3000:3000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
